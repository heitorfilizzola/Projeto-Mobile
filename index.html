<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação Concluída | Sucesso</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Variáveis de Cor e Estilo */
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-start: #00ff87; /* Verde Neon */
            --accent-end: #60efff;   /* Ciano Neon */
            --transition-speed: 0.6s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Efeito de Luz de Fundo (Ambient Glow) */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 255, 135, 0.15) 0%, rgba(10, 10, 10, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        /* Container Principal com Glassmorphism */
        .success-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3rem 4rem;
            border-radius: 30px;
            text-align: center;
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(30px);
            animation: cardEntrance var(--transition-speed) cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Animação do Ícone de Check */
        .checkmark-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .checkmark-circle {
            fill: none;
            stroke: url(#gradientAccent);
            stroke-width: 2;
            stroke-miterlimit: 10;
            cx: 50;
            cy: 50;
            r: 48;
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: circleDraw 1s cubic-bezier(0.65, 0, 0.45, 1) 0.3s forwards;
            opacity: 0.5;
        }

        .checkmark-check {
            fill: none;
            stroke: var(--accent-start);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: checkDraw 0.8s cubic-bezier(0.65, 0, 0.45, 1) 1s forwards;
            filter: drop-shadow(0 0 8px var(--accent-start));
        }
        
        /* Efeito de explosão de luz atrás do check */
        .checkmark-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 120%;
            height: 120%;
            background: radial-gradient(circle, var(--accent-start) 0%, transparent 60%);
            opacity: 0;
            animation: burstAnim 0.8s ease-out 1s forwards;
        }


        /* Tipografia */
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            /* Texto com gradiente */
            background: linear-gradient(to right, var(--accent-start), var(--accent-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.6s forwards;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.8s forwards;
        }

        /* Botão Moderno */
        .btn-primary {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(45deg, var(--accent-start), var(--accent-end));
            color: #000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 135, 0.3);
            opacity: 0;
            animation: fadeUp 0.8s ease-out 1s forwards;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(96, 239, 255, 0.4);
        }
        
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .btn-primary:hover::after {
            left: 100%;
        }

        .redirect-timer {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            opacity: 0;
            animation: fadeIn 1s ease-out 2s forwards;
        }
        
        #timer-count {
            color: var(--accent-end);
            font-weight: bold;
        }

        /* Keyframes das Animações */
        @keyframes cardEntrance {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            to { opacity: 0.7; }
        }
        @keyframes circleDraw {
            to { stroke-dashoffset: 0; }
        }
        @keyframes checkDraw {
            to { stroke-dashoffset: 0; }
        }
        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }
        @keyframes burstAnim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
        
        /* Responsividade básica */
        @media (max-width: 600px) {
            .success-card {
                padding: 2rem;
                width: 95%;
            }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <main class="success-card">
        <div class="checkmark-container">
            <div class="checkmark-burst"></div>
            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="gradientAccent" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--accent-start)" />
                        <stop offset="100%" style="stop-color:var(--accent-end)" />
                    </linearGradient>
                </defs>
                <circle class="checkmark-circle" cx="50" cy="50" r="48"/>
                <polyline class="checkmark-check" points="28,53 42,67 74,35"/>
            </svg>
        </div>

        <h1>Email Verificado!</h1>
        <p>Sua conta foi confirmada com sucesso. Você já pode aproveitar todos os recursos da nossa plataforma.</p>

        <a href="notesync://email-verificado" class="btn-primary" id="continue-btn">Continuar Agora</a>

        <div class="redirect-timer">
            Redirecionando automaticamente em <span id="timer-count">5</span> segundos.
        </div>
    </main>

    <script>
        // Script para contagem regressiva e redirecionamento
        let count = 5;
        const timerElement = document.getElementById('timer-count');
        const redirectUrl = "notesync://email-verificado";
        const countdown = setInterval(() => {
            count--;
            if (count > 0) {
                timerElement.textContent = count;
            } else {
                clearInterval(countdown);
                timerElement.textContent = "0";
                // Realiza o redirecionamento
                // window.location.href = redirectUrl; // Descomente esta linha para ativar o redirecionamento
                console.log("Redirecionando para: " + redirectUrl);
            }
        }, 1000);

        // Efeito sutil de paralaxe no mousemove para dar mais vida
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.success-card');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
        
        // Resetar a transformação quando o mouse sai, para não ficar torto
        document.addEventListener('mouseleave', (e) => {
             const card = document.querySelector('.success-card');
             card.style.transform = `rotateY(0deg) rotateX(0deg) translateY(0)`;
             // Nota: precisamos manter o translateY(0) do final da animação de entrada
        });

    </script>
</body>
</html>
